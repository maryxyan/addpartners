name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter '@workspace/api-server' run build

      - name: Build production frontend
        run: pnpm --filter '@workspace/terenuri-imobiliare' run build
        env:
          BASE_PATH: /
          PORT: 4173
          VITE_API_URL: https://api.addpartners.ro
          VITE_SITE_URL: https://addpartners.ro

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: addpartners-frontend-${{ github.sha }}
          path: artifacts/terenuri-imobiliare/dist/public
          if-no-files-found: error
          retention-days: 14
